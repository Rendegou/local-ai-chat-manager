[package]
name = "local-ai-chat-manager"
description = "Local AI Chat Manager 桌面客户端（Tauri 2 外壳）"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aichat_app"
# 只产出 rlib：桌面端不需要 cdylib/staticlib（那是给 Android/iOS 用的）。
# 另外 MinGW 链接 DLL 时会有「export ordinal too large」限制，去掉 cdylib 可规避。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建：让 Tauri 使用「打包进二进制」的前端资源，而不是 dev 服务器。
# `npm run tauri:build`（Tauri CLI）会自动开启它；直接用 cargo 构建时需要显式指定：
#   cargo build --release -p local-ai-chat-manager --features production
production = ["tauri/custom-protocol"]

[dependencies]
# 全部业务逻辑在 aichat-core 中，外壳只做 IPC 转发
aichat-core = { path = "../crates/aichat-core" }
tauri = { version = "2", features = [] }
# 目录选择（选择同步仓库 / 会话目录）
tauri-plugin-dialog = "2"
# 打开仓库目录 / 用系统程序打开文件
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
