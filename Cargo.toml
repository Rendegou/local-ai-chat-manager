# Local AI Chat Manager —— Rust 工作区
#
# 拆分为两个 crate：
# - `crates/aichat-core`：全部业务逻辑（适配器 / 解析 / 索引 / 搜索 / Git 同步 / 归档），
#   不依赖 Tauri，因此可以快速跑单元测试与集成测试；
# - `src-tauri`：Tauri 2 外壳，只做 IPC 命令转发与窗口管理。
[workspace]
resolver = "2"
members = ["crates/aichat-core", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "local"

[workspace.dependencies]
# 序列化：IPC 与快照文件（meta.json / conversation.jsonl）统一使用 camelCase
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误类型：禁止大量 unwrap，统一分类
thiserror = "2"
# 本地索引：bundled 自带 SQLite 与 FTS5，免安装外部依赖
rusqlite = { version = "0.32", features = ["bundled"] }
# 文件指纹：比 SHA256 更快，适合大文件增量扫描
blake3 = "1"
# 目录遍历：扫描 session 目录
walkdir = "2"
# 文件监听：配合自实现的 debounce
notify = "6"
# 结构化日志：不记录 prompt / token / 正文
tracing = "0.1"
# 归档压缩：zstd 优先，gzip 兜底
zstd = "0.13"
flate2 = "1"
tar = "0.4"
# machine id 生成
uuid = { version = "1", features = ["v4"] }
# 时间处理：统一输出 RFC3339（可字符串排序）
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
# 桌面端体积与启动速度优先
lto = true
codegen-units = 1
strip = true
panic = "abort"
