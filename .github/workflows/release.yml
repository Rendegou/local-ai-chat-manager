name: Release

# 触发方式：
#   1. 推 v* tag（常规发版）
#   2. Actions 页面手动触发（workflow_dispatch）：填 tag 就重新构建并覆盖该版本产物，
#      留空则只构建 + 校验、不发布（用来验证 workflow 本身）
#
# 流程刻意拆成两段：build（矩阵：Windows / macOS）→ 各自校验产物 → 单个 publish 挂 Release。
# 校验不通过就没有任何东西进 Release —— v0.4.2 的坏 dmg 就是因为「先发布、没人校验」。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（如 v0.4.2）；留空则只构建不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --bundles nsis,msi
            paths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            name: macos-universal
            # universal：aarch64 + x86_64 合成一个 dmg，Intel 与 Apple Silicon 共用
            args: --target universal-apple-darwin --bundles dmg
            paths: target/**/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # universal 需要两个架构的标准库；runner 只自带宿主架构那一个
      - name: macOS 补装 x86_64 target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: 构建安装包
        run: npm run tauri:build -- ${{ matrix.args }}
        env:
          # ad-hoc 签名（伪身份 "-"）：没有 Apple 证书时也让 .app 处于「已签名」状态，
          # 否则下载后 Gatekeeper 报「已损坏，无法打开」。
          #
          # 注意：这里**不能**顺手写上 APPLE_CERTIFICATE / APPLE_ID 之类的未配置 secret。
          # GitHub 会把未配置的 secret 传成空字符串，Tauri 看到变量存在就当成「有证书」，
          # 去执行 security import 然后失败（实测：failed to import keychain certificate）。
          # 将来真配了 Apple 开发者证书，再单独加一步，只在有值时注入：
          #   if: runner.os == 'macOS' && secrets.APPLE_CERTIFICATE != ''
          #   run: |
          #     {
          #       echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
          #       echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          #       echo "APPLE_ID=${{ secrets.APPLE_ID }}"
          #       echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
          #       echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          #     } >> "$GITHUB_ENV"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}

      # 内联而不是放独立脚本文件：build job checkout 的是要发布的 tag，
      # 补发老 tag 时它的树里没有后加的文件，独立脚本会以 127 直接失败。
      - name: 校验 macOS 产物
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          DMG=$(find target -path '*/bundle/dmg/*.dmg' -type f | head -n 1)
          [ -n "$DMG" ] || fail "没有找到 dmg 产物（预期在 target/**/bundle/dmg/ 下）"
          # 变量一律用 ${} 包住：macOS 的 /bin/bash 是 3.2，按字节认变量名，
          # $DMG（ 这种「变量紧跟全角字符」会被它当成变量名 DMG（ → unbound variable
          echo "dmg：${DMG}（$(du -h "${DMG}" | cut -f 1)）"

          VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n 1)
          [ -n "$VERSION" ] || fail "读不到 src-tauri/tauri.conf.json 里的 version"
          case "$(basename "$DMG")" in
            *"$VERSION"*) ;;
            *) fail "dmg 文件名里没有版本号 $VERSION —— tag 与 tauri.conf.json 的版本对不上？" ;;
          esac

          hdiutil verify "$DMG" >/dev/null || fail "hdiutil verify 不通过：dmg 文件本身损坏"

          MNT=$(mktemp -d)
          unmount() {
            hdiutil detach "$MNT" -quiet >/dev/null 2>&1 || true
            rmdir "$MNT" 2>/dev/null || true
          }
          trap unmount EXIT

          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" -quiet || fail "dmg 挂载失败"
          APP=$(find "$MNT" -maxdepth 1 -name '*.app' -type d | head -n 1)
          [ -n "$APP" ] || fail "dmg 里没有 .app"
          [ -L "$MNT/Applications" ] || fail "dmg 里缺少指向 /Applications 的符号链接（用户无法拖拽安装）"
          echo "app：$(basename "$APP")"

          [ -d "$APP/Contents/_CodeSignature" ] \
            || fail "bundle 未签名：缺少 Contents/_CodeSignature —— 下载后 macOS 会报「已损坏，无法打开」"
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          [ -x "$BIN" ] || fail "可执行文件不存在或不可执行：$BIN"

          echo "--- 签名 ---"
          codesign -dv --verbose=4 "$APP" 2>&1 \
            | grep -E '^(Identifier|Format|CodeDirectory|Signature|Authority|TeamIdentifier|Sealed Resources)' || true
          codesign --verify --deep --strict --verbose=2 "$APP" || fail "codesign --verify 不通过：签名无效或文件被改动"

          echo "--- 架构 ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q 'arm64'  || fail "缺少 arm64 切片：Apple Silicon 上无法运行"
          lipo -info "$BIN" | grep -q 'x86_64' || fail "缺少 x86_64 切片：Intel Mac 上无法运行"

          echo "--- Gatekeeper（未公证时 rejected 属预期，仅供参考）---"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true

          echo "macOS 产物校验通过"

      - name: 校验 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 让中文报错在 CI 日志里可读（默认按控制台代码页输出会乱码）
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $msi = @(Get-ChildItem -Path target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue)
          $exe = @(Get-ChildItem -Path target/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue)
          if ($msi.Count -lt 1 -or $exe.Count -lt 1) {
            throw "缺少安装包：msi=$($msi.Count) nsis-setup.exe=$($exe.Count)"
          }
          foreach ($f in @($msi) + @($exe)) {
            if ($f.Length -lt 1MB) { throw "$($f.Name) 体积异常（$([math]::Round($f.Length / 1MB, 2)) MB）" }
            if ($f.Name -notlike "*$version*") {
              throw "$($f.Name) 文件名里没有版本号 $version —— tag 与 tauri.conf.json 的版本对不上？"
            }
            Write-Host ("{0}  {1:N2} MB" -f $f.Name, ($f.Length / 1MB))
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    name: 发布到 Release
    needs: build
    # 手动触发时留空 tag（分支名不以 v 开头）就只构建不发布
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      # 注意不覆盖 ref：说明文件取自触发这次运行的分支/tag。
      # （build 用的是要发布的 tag，但补发老 tag 时它里面可能还没有这份说明文件）
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布产物
        run: ls -lh dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TITLE="Local AI Chat Manager $TAG"
          if [ -f .github/release-notes.md ]; then
            NOTES=(--notes-file .github/release-notes.md)
          else
            NOTES=(--generate-notes)
          fi

          # download-artifact 会保留 artifact 内部的相对路径（dist/msi/x.msi 这种），
          # 先拍平再操作 —— 否则会拿目录名去比资产名，把该留的包当成「过期产物」删掉
          mkdir -p out
          find dist -type f | while IFS= read -r f; do cp "$f" out/; done
          COUNT=$(find out -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::待发布产物只有 ${COUNT} 个，中止（不动 Release 上已有的资产）"
            ls -lR dist
            exit 1
          fi
          ls -lh out

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：刷新说明并覆盖产物"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" "${NOTES[@]}"
            # 先上传再清理：万一上传失败，Release 上原来的资产还在
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber out/*
            # 清掉本次不再产出的旧包（例如 v0.4.2 那个只有 arm64 的坏 dmg），
            # 否则它会和新包一起挂在 Release 上，用户很可能下错
            want=$(cd out && ls | tr ' ' '.')
            for name in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
              if ! printf '%s\n' "$want" | grep -qxF "$name"; then
                echo "删除过期产物：$name"
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" "${NOTES[@]}" out/*
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
